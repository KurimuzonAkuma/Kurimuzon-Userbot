[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E9",
    "EXE",
    "F",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PYI",
    "RSE",
    "RUF013",
    "SLOT",
    "T10",
    "TC",
    "UP",
    "W",
    "YTT",
]

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
